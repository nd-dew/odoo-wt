[project]
name = "odoo-wt"
version = "0.2.0"
description = "Modern TUI-driven Odoo Worktree Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.52.1", "rich>=13.7.1"]

[project.scripts]
odoo-wt = "odoo_wt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "rich>=14.3.3",
]
